# Git hooks via Lefthook.
# pre-commit: auto-fix style (Pint on dirty PHP files)
# pre-push: style check (no fix) + full test suite
# Skip once: LEFTHOOK=0 git commit | git push --no-verify

pre-commit:
  parallel: false
  commands:
    pint:
      glob: "*.php"
      run: vendor/bin/sail bin pint --dirty
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    pint:
      run: vendor/bin/sail bin pint --dirty --test
    tests:
      run: vendor/bin/sail artisan test --compact
